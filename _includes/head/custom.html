{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>


  <style>
  html { scroll-behavior: smooth; }
  h1[id], h2[id], h3[id], h4[id] { scroll-margin-top: 80px; }

  /* 缩小正文字体 */
  .page__content {
    font-size: 15px;
  }

  /* 页脚背景：浅灰 */
  .page__footer {
    background-color: #f5f5f5 !important;
    border-top: 1px solid #e5e5e5 !important;
  }

  /* 访客地图 */
  .visitors-widget {
    display: flex;
    justify-content: center;
    margin: 0.75rem 0 1.5rem;
  }
  .visitors-widget .visitors-inner {
    width: 66.666%;
    max-width: 800px;
  }
  .visitors-widget .visitors-inner canvas,
  .visitors-widget .visitors-inner iframe,
  .visitors-widget .visitors-inner img {
    width: 100% !important;
    height: auto !important;
    display: block;
  }

  /* ===== 论文卡片样式 ===== */
  .pub-list {
    margin: 0.5em 0 0;
    padding: 0;
  }

  .pub-year {
    font-size: 15px;
    font-weight: 700;
    color: #333;
    margin: 1.4em 0 0.6em;
    padding-bottom: 5px;
    border-bottom: 2px solid #e0e0e0;
  }

  .pub-item {
    display: flex;
    gap: 14px;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid #f2f2f2;
    align-items: flex-start;
  }
  .pub-item:last-child {
    border-bottom: none;
  }

  .pub-badge-col {
    flex-shrink: 0;
    width: 52px;
    padding-top: 2px;
    text-align: center;
  }

  .pub-venue-abbr {
    display: inline-block;
    padding: 3px 5px;
    font-size: 11px;
    font-weight: 700;
    border-radius: 4px;
    color: #fff;
    background: #3a7ade;
    line-height: 1.3;
    text-align: center;
    min-width: 40px;
    letter-spacing: 0.02em;
  }
  .pub-venue-abbr.journal {
    background: #2a9d5c;
  }

  .pub-body {
    flex: 1;
    min-width: 0;
  }

  .pub-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.45;
    margin-bottom: 4px;
    color: #1a1a1a;
  }
  .pub-title a {
    color: #1a1a1a;
    text-decoration: none;
  }
  .pub-title a:hover {
    color: #2563eb;
    text-decoration: underline;
  }

  .pub-authors {
    font-size: 13px;
    color: #555;
    margin-bottom: 4px;
    line-height: 1.4;
  }

  .pub-venue-line {
    font-size: 13px;
    color: #666;
    line-height: 1.4;
    margin-bottom: 6px;
  }

  .ccf-badge {
    display: inline-block;
    padding: 1px 5px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 3px;
    margin-left: 5px;
    vertical-align: middle;
  }
  .ccf-a  { background: #fce8e8; color: #b91c1c; }
  .ccf-b  { background: #fff3e0; color: #c2610c; }
  .sci-q1 { background: #e8f0fe; color: #1a56db; }

  .pub-links {
    margin-top: 5px;
  }
  .pub-btn {
    display: inline-block;
    padding: 2px 8px;
    font-size: 11px;
    border-radius: 3px;
    border: 1px solid #d0d0d0;
    color: #555 !important;
    text-decoration: none !important;
    margin-right: 4px;
    background: #fafafa;
    transition: all 0.15s;
  }
  .pub-btn:hover {
    background: #f0f0f0;
    border-color: #999;
    color: #333 !important;
  }
</style>

<!-- end custom head snippets -->
